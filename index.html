<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover: without it the iPad leaves black bars over the side safe areas -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <!-- "Add to Home Screen" on iPad/iPhone opens with no Safari bars at all -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Armony Flow" />
  <title>Armony Flow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <div class="slide" id="slideA"><img alt="" /></div>
    <div class="slide" id="slideB"><img alt="" /></div>
    <div class="vignette"></div>
  </div>

  <div id="start">
    <button id="startBtn" type="button">
      <span class="title">Armony Flow</span>
      <span class="hint" data-i18n="tapToStart">tap to begin</span>
    </button>
  </div>

  <div id="ui">
    <div id="credits">
      <div id="photoCredit"></div>
      <div id="trackCredit"></div>
    </div>
    <div id="controls">
      <div class="group">
        <button id="prevBtn" type="button" data-i18n-label="prev" data-key="B">
          <svg viewBox="0 0 24 24"><rect x="5" y="5" width="2.5" height="14" rx="1"/><path d="M19 6.2v11.6a1 1 0 0 1-1.52.85L9.5 13.7a1 1 0 0 1 0-1.7l7.98-4.95A1 1 0 0 1 19 6.2z"/></svg>
        </button>
        <button id="playBtn" class="primary" type="button" data-i18n-label="pause" data-key="Space">
          <svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
        </button>
        <button id="nextBtn" type="button" data-i18n-label="next" data-key="N">
          <svg viewBox="0 0 24 24"><rect x="16.5" y="5" width="2.5" height="14" rx="1"/><path d="M5 6.2v11.6a1 1 0 0 0 1.52.85l7.98-4.95a1 1 0 0 0 0-1.7L6.52 7.05A1 1 0 0 0 5 6.2z"/></svg>
        </button>
      </div>
      <div class="group">
        <button id="listBtn" type="button" aria-expanded="false" aria-controls="panel" data-i18n-label="panel" data-key="P">
          <svg viewBox="0 0 24 24"><path class="stroke" d="M4 6h11M4 11h11M4 16h7"/><circle cx="17.5" cy="16.5" r="2.5"/><path class="stroke" d="M20 16.5V8.5l-2.5-.8"/></svg>
        </button>
        <button id="muteBtn" type="button" data-i18n-label="mute" data-key="M">
          <svg class="i-sound" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="stroke" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
          <svg class="i-muted" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="stroke" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>
        </button>
        <button id="fsBtn" type="button" data-i18n-label="fullscreen" data-key="F">
          <svg class="i-expand" viewBox="0 0 24 24"><path class="stroke" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          <svg class="i-shrink" viewBox="0 0 24 24"><path class="stroke" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
        </button>
      </div>
    </div>
  </div>

  <aside id="panel" hidden data-i18n-label="panel">
    <header class="panel-head">
      <div class="tabs" role="tablist">
        <button id="tabMusic" class="tab" type="button" role="tab" aria-selected="true" aria-controls="paneMusic" data-i18n="music">Music</button>
        <button id="tabPhotos" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panePhotos" data-i18n="photos">Photos</button>
      </div>
      <div id="langToggle" class="lang" role="group" data-i18n-label="language"></div>
      <button id="closePanel" class="icon-btn" type="button" data-i18n-label="close">
        <svg viewBox="0 0 24 24"><path class="stroke" d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>

    <!-- the only scroll container in the panel: no nested scrolling on small screens -->
    <div class="panel-body">
      <section id="paneMusic" role="tabpanel" aria-labelledby="tabMusic">
        <div id="musicCards" class="music-cards"></div>
        <h3 class="list-head"><span data-i18n="playlist">Playlist</span><span id="trackCount"></span></h3>
        <ol id="trackList"></ol>
      </section>
      <section id="panePhotos" role="tabpanel" aria-labelledby="tabPhotos" hidden>
        <div id="photoCards" class="photo-cards"></div>
      </section>
    </div>
  </aside>

  <audio id="audio" preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
