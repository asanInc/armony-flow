<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover: without it the iPad leaves black bars over the side safe areas -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <!-- "Add to Home Screen" on iPad/iPhone opens with no Safari bars at all -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Armony Flow" />
  <title>Armony Flow</title>
  <!-- Apple devices use SF Pro through -apple-system; Inter is the closest match elsewhere -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <div class="slide" id="slideA"><img alt="" /></div>
    <div class="slide" id="slideB"><img alt="" /></div>
    <div class="vignette"></div>
  </div>

  <!-- Start screen: the first landscape waits behind, blurred, and comes into focus on start -->
  <div id="start">
    <div id="startBg" class="start-bg" aria-hidden="true"></div>
    <div class="start-content">
      <h1 class="start-title">Armony Flow</h1>
      <p class="start-tagline" data-i18n="tagline">Landscape photos with ambient music</p>
      <button id="startBtn" class="start-btn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 5.2v13.6c0 .9 1 1.5 1.8 1l10.6-6.8c.7-.5.7-1.5 0-2L9.3 4.2c-.8-.5-1.8.1-1.8 1z"/></svg>
        <span data-i18n="start">Start</span>
      </button>
      <p id="startStatus" class="start-status" aria-live="polite"></p>
    </div>
  </div>

  <div id="ui">
    <div id="credits">
      <div id="photoCredit" class="credit"></div>
      <div id="trackCredit" class="credit"></div>
    </div>
    <div id="controls">
      <div class="capsule glass">
        <button id="prevBtn" type="button" data-i18n-label="prev" data-key="B">
          <svg viewBox="0 0 24 24"><path d="M11.5 6.6v10.8c0 .8-.9 1.3-1.6.8L2.6 12.8a1 1 0 0 1 0-1.6l7.3-5.4c.7-.5 1.6 0 1.6.8zM21.5 6.6v10.8c0 .8-.9 1.3-1.6.8l-7.3-5.4a1 1 0 0 1 0-1.6l7.3-5.4c.7-.5 1.6 0 1.6.8z"/></svg>
        </button>
        <button id="playBtn" class="primary" type="button" data-i18n-label="pause" data-key="Space">
          <svg class="i-pause" viewBox="0 0 24 24"><rect x="5.5" y="4.5" width="4.6" height="15" rx="1.4"/><rect x="13.9" y="4.5" width="4.6" height="15" rx="1.4"/></svg>
          <svg class="i-play" viewBox="0 0 24 24"><path d="M7.5 5.2v13.6c0 .9 1 1.5 1.8 1l10.6-6.8c.7-.5.7-1.5 0-2L9.3 4.2c-.8-.5-1.8.1-1.8 1z"/></svg>
        </button>
        <button id="nextBtn" type="button" data-i18n-label="next" data-key="N">
          <svg viewBox="0 0 24 24"><path d="M2.5 6.6v10.8c0 .8.9 1.3 1.6.8l7.3-5.4a1 1 0 0 0 0-1.6L4.1 5.8c-.7-.5-1.6 0-1.6.8zM12.5 6.6v10.8c0 .8.9 1.3 1.6.8l7.3-5.4a1 1 0 0 0 0-1.6l-7.3-5.4c-.7-.5-1.6 0-1.6.8z"/></svg>
        </button>
      </div>
      <div class="capsule glass">
        <button id="listBtn" type="button" aria-expanded="false" aria-controls="panel" data-i18n-label="panel" data-key="P">
          <svg viewBox="0 0 24 24"><path class="stroke" d="M3.5 6h11M3.5 11h11M3.5 16h6.5"/><path d="M17.2 18.4a2.3 2.3 0 1 1-1.5-2.2V6.9c0-.6.4-1 1-1.1l3.2-.6c.5-.1.9.3.9.8v1.3c0 .4-.3.8-.7.8l-2.9.6z"/></svg>
        </button>
        <button id="muteBtn" type="button" data-i18n-label="mute" data-key="M">
          <svg class="i-sound" viewBox="0 0 24 24"><path d="M3 9.6v4.8c0 .6.5 1 1 1h2.6l4.3 3.7c.6.5 1.6.1 1.6-.8V5.7c0-.9-1-1.3-1.6-.8L6.6 8.6H4c-.5 0-1 .4-1 1z"/><path class="stroke" d="M15.8 9a4.2 4.2 0 0 1 0 6M18.6 6.4a8 8 0 0 1 0 11.2"/></svg>
          <svg class="i-muted" viewBox="0 0 24 24"><path d="M3 9.6v4.8c0 .6.5 1 1 1h2.6l4.3 3.7c.6.5 1.6.1 1.6-.8V5.7c0-.9-1-1.3-1.6-.8L6.6 8.6H4c-.5 0-1 .4-1 1z"/><path class="stroke" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
        </button>
        <button id="fsBtn" type="button" data-i18n-label="fullscreen" data-key="F">
          <svg class="i-expand" viewBox="0 0 24 24"><path class="stroke" d="M14.5 3.5h6v6M20.5 3.5l-6.5 6.5M9.5 20.5h-6v-6M3.5 20.5l6.5-6.5"/></svg>
          <svg class="i-shrink" viewBox="0 0 24 24"><path class="stroke" d="M20.5 9.5h-6v-6M14.5 9.5l6-6M3.5 14.5h6v6M9.5 14.5l-6 6"/></svg>
        </button>
      </div>
    </div>
  </div>

  <aside id="panel" hidden data-i18n-label="panel">
    <div class="grabber" aria-hidden="true"></div>
    <header class="panel-head">
      <button id="closePanel" class="icon-btn" type="button" data-i18n-label="close">
        <svg viewBox="0 0 24 24"><path class="stroke" d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      </button>
      <div class="tabs segmented" role="tablist" data-active="music">
        <span class="thumb" aria-hidden="true"></span>
        <button id="tabMusic" class="tab" type="button" role="tab" aria-selected="true" aria-controls="paneMusic" data-i18n="music">Music</button>
        <button id="tabPhotos" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panePhotos" data-i18n="photos">Photos</button>
      </div>
      <div id="langToggle" class="lang segmented" role="group" data-i18n-label="language"></div>
    </header>

    <!-- the only scroll container in the panel: no nested scrolling on small screens -->
    <div class="panel-body">
      <section id="paneMusic" role="tabpanel" aria-labelledby="tabMusic">
        <div id="musicCards" class="music-cards"></div>
        <h2 class="list-head"><span data-i18n="playlist">Playlist</span><span id="trackCount"></span></h2>
        <ol id="trackList"></ol>
      </section>
      <section id="panePhotos" role="tabpanel" aria-labelledby="tabPhotos" hidden>
        <div id="photoCards" class="photo-cards"></div>
      </section>
    </div>
  </aside>

  <audio id="audio" preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
